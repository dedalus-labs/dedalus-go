name: Go SDK Release

on:
  # Manual re-publish only: the automated publish for each release runs as the `publish` job
  # inside release-please.yml, in the same run that cuts the tag (dispatching a workflow here
  # instead would resolve it on the repository's default branch only, which breaks releasing
  # from any other release line). Dispatch this workflow at an existing release tag to re-run
  # a failed or skipped publish. A dispatched run is top-level, so OIDC trusted-publisher
  # claims name this file; register it as an additional trusted publisher only when manual
  # re-publishes are used. Never add a workflow_call trigger here — registries reject
  # publishes from called (reusable) workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      # Go modules publish via the git tag itself — there is nothing to upload. This asks the
      # public Go module proxy for the just-tagged version so it is cached (and the release is
      # indexed on pkg.go.dev) immediately instead of on the first consumer's fetch. The module
      # path is read from go.mod at run time — no spec-derived value is interpolated into this
      # workflow — and `go mod download` from a scratch module handles the proxy's module-path
      # case-encoding. Best-effort by design: a private repository is invisible to the public
      # proxy, and a failed warm-up must not mark the release run as failed.
      - name: Warm the public Go module proxy
        run: |
          module="$(go list -m)"
          if ! version="$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null)"; then
            echo "::warning::No release tag points at this commit; skipping the proxy warm-up."
            exit 0
          fi
          cd "$(mktemp -d)"
          go mod init proxy-warm-up
          if GOPROXY=https://proxy.golang.org go mod download "${module}@${version}"; then
            echo "Warmed proxy.golang.org for ${module}@${version}"
          else
            echo "::warning::Could not warm proxy.golang.org for ${module}@${version}; consumers will populate the cache on first fetch."
          fi
